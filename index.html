<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Path d-Attribute Animator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen text-white">
<div class="max-w-4xl mx-auto p-4">
  <h1 class="text-2xl font-bold mb-1">SVG Path Animator</h1>
  <p class="text-gray-400 text-sm mb-6">Edit SVG path data and animate morphing between two shapes.</p>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <!-- Controls -->
    <div class="space-y-4">
      <div class="bg-gray-800 rounded-xl p-4">
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Path A (d attribute)</label>
        <textarea id="pathA" class="w-full bg-gray-900 text-green-400 font-mono text-xs rounded-lg p-2 border border-gray-700 h-24 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="updatePath()">M 50 100 C 50 50, 150 50, 150 100 S 250 150, 250 100</textarea>
        <button onclick="storePath('A')" class="mt-2 px-3 py-1 bg-blue-600 text-white rounded-lg text-xs hover:bg-blue-700">Store as Path A</button>
      </div>

      <div class="bg-gray-800 rounded-xl p-4">
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Path B (for morph animation)</label>
        <textarea id="pathB" class="w-full bg-gray-900 text-yellow-400 font-mono text-xs rounded-lg p-2 border border-gray-700 h-24 resize-none focus:outline-none focus:ring-2 focus:ring-yellow-500">M 50 150 L 150 50 L 250 150 Z</textarea>
        <button onclick="storePath('B')" class="mt-2 px-3 py-1 bg-yellow-600 text-white rounded-lg text-xs hover:bg-yellow-700">Store as Path B</button>
      </div>

      <div class="bg-gray-800 rounded-xl p-4 grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Stroke Color</label>
          <input type="color" id="strokeColor" value="#60a5fa" oninput="updatePath()" class="w-full h-9 rounded cursor-pointer border-0 bg-transparent">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Fill Color</label>
          <input type="color" id="fillColor" value="#1e3a5f" oninput="updatePath()" class="w-full h-9 rounded cursor-pointer border-0 bg-transparent">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Stroke Width</label>
          <input type="range" id="strokeWidth" min="1" max="12" value="3" oninput="updatePath(); document.getElementById('swVal').textContent=this.value" class="w-full mt-1">
          <span class="text-xs text-gray-400">Width: <span id="swVal">3</span>px</span>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Anim Speed</label>
          <input type="range" id="animSpeed" min="500" max="5000" step="100" value="1500" oninput="document.getElementById('spVal').textContent=(this.value/1000).toFixed(1)" class="w-full mt-1">
          <span class="text-xs text-gray-400">Speed: <span id="spVal">1.5</span>s</span>
        </div>
      </div>

      <button onclick="toggleAnimation()" id="animBtn" class="w-full py-2 bg-purple-600 text-white rounded-xl font-semibold hover:bg-purple-700 transition">Start Morph Animation</button>

      <div id="errorMsg" class="hidden text-red-400 text-xs bg-red-900/30 rounded-lg p-2"></div>
    </div>

    <!-- SVG Preview -->
    <div class="bg-gray-800 rounded-xl p-4 flex flex-col">
      <div class="text-xs font-semibold text-gray-400 uppercase mb-2">Live Preview</div>
      <div class="flex-1 bg-gray-900 rounded-lg overflow-hidden flex items-center justify-center" style="min-height:300px">
        <svg id="svgCanvas" viewBox="0 0 300 200" width="100%" height="100%" style="max-height:350px">
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#374151" stroke-width="0.5"/>
            </pattern>
          </defs>
          <rect width="300" height="200" fill="url(#grid)"/>
          <path id="svgPath" d="" fill="#1e3a5f" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="mt-2 text-xs text-gray-500 text-center">SVG ViewBox: 0 0 300 200</div>
    </div>
  </div>
</div>

<script>
let storedA = 'M 50 100 C 50 50, 150 50, 150 100 S 250 150, 250 100';
let storedB = 'M 50 150 L 150 50 L 250 150 Z';
let animating = false;
let animFrame = null;
let animStart = null;
let animDir = 1;

function updatePath() {
  const d = document.getElementById('pathA').value.trim();
  const path = document.getElementById('svgPath');
  const stroke = document.getElementById('strokeColor').value;
  const fill = document.getElementById('fillColor').value;
  const sw = document.getElementById('strokeWidth').value;
  try {
    path.setAttribute('d', d);
    path.setAttribute('stroke', stroke);
    path.setAttribute('fill', fill);
    path.setAttribute('stroke-width', sw);
    document.getElementById('errorMsg').classList.add('hidden');
  } catch(e) {
    document.getElementById('errorMsg').textContent = 'Invalid path: ' + e.message;
    document.getElementById('errorMsg').classList.remove('hidden');
  }
}

function storePath(which) {
  if (which === 'A') { storedA = document.getElementById('pathA').value.trim(); }
  else { storedB = document.getElementById('pathB').value.trim(); }
}

function parsePath(d) {
  // Extract numeric values from path
  const nums = d.match(/-?\d+\.?\d*/g) || [];
  return nums.map(Number);
}

function interpolatePath(pA, pB, t) {
  const nA = parsePath(pA);
  const nB = parsePath(pB);
  const len = Math.min(nA.length, nB.length);
  // Simple interpolation: rebuild path A structure with interpolated coords
  let result = pA;
  const interp = nA.slice(0, len).map((v, i) => v + (nB[i] - v) * t);
  let idx = 0;
  result = pA.replace(/-?\d+\.?\d*/g, () => {
    if (idx < interp.length) return interp[idx++].toFixed(1);
    return '0';
  });
  return result;
}

function toggleAnimation() {
  animating = !animating;
  const btn = document.getElementById('animBtn');
  if (animating) {
    storePath('A'); storePath('B');
    btn.textContent = 'Stop Animation';
    btn.className = btn.className.replace('bg-purple-600 hover:bg-purple-700', 'bg-red-600 hover:bg-red-700');
    animStart = null;
    animate();
  } else {
    btn.textContent = 'Start Morph Animation';
    btn.className = btn.className.replace('bg-red-600 hover:bg-red-700', 'bg-purple-600 hover:bg-purple-700');
    if (animFrame) cancelAnimationFrame(animFrame);
  }
}

function animate(ts) {
  if (!animating) return;
  if (!animStart) animStart = ts;
  const duration = parseInt(document.getElementById('animSpeed').value);
  const elapsed = ts - animStart;
  let t = (elapsed % (duration * 2)) / duration;
  if (t > 1) t = 2 - t; // ping-pong
  const interp = interpolatePath(storedA, storedB, t);
  document.getElementById('svgPath').setAttribute('d', interp);
  animFrame = requestAnimationFrame(animate);
}

updatePath();
</script>
</body>
</html>
